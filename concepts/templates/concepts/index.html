<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plano de Estudos · Matemática para ML</title>

    <!-- Bootstrap 5 (Light Theme) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />

    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-dark: #1e40af;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            color: var(--gray-800);
            padding: 32px 16px;
            min-height: 100vh;
        }

        /* Container principal */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ============================================
           TOP BAR
           ============================================ */
        .top-bar {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--gray-200);
            margin-bottom: 32px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px 24px;
        }

        .top-bar .brand h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--gray-900);
            margin: 0;
        }

        .top-bar .brand h1 span {
            color: var(--primary);
        }

        .top-bar .brand .subtitle {
            font-size: 14px;
            font-weight: 400;
            color: var(--gray-500);
            margin-top: 2px;
        }

        .top-bar .stats {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .top-bar .stats .progress-wrap {
            min-width: 160px;
        }

        .top-bar .stats .progress-wrap .progress-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-600);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .top-bar .stats .progress-wrap .progress {
            height: 6px;
            border-radius: 10px;
            background: var(--gray-200);
        }

        .top-bar .stats .progress-wrap .progress .progress-bar {
            background: var(--success);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .btn-reset {
            background: var(--gray-100);
            border: 1px solid var(--gray-200);
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-600);
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn-reset:hover {
            background: var(--gray-200);
            color: var(--gray-800);
            border-color: var(--gray-300);
        }

        .btn-reset .material-symbols-outlined {
            font-size: 18px;
        }

        /* ============================================
           FASE (SECTION)
           ============================================ */
        .phase-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px 24px 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--gray-200);
            margin-bottom: 24px;
            transition: box-shadow 0.2s;
        }

        .phase-card:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .phase-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--gray-100);
            margin-bottom: 18px;
        }

        .phase-header .icon-wrap {
            width: 42px;
            height: 42px;
            background: var(--primary-light);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .phase-header .icon-wrap .material-symbols-outlined {
            font-size: 24px;
            color: var(--primary);
        }

        .phase-header .phase-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--gray-900);
            margin: 0;
            letter-spacing: -0.01em;
        }

        .phase-header .phase-desc {
            font-size: 13px;
            color: var(--gray-500);
            font-weight: 400;
            margin-left: 4px;
        }

        .phase-header .phase-count {
            margin-left: auto;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-600);
            background: var(--gray-100);
            padding: 4px 16px;
            border-radius: 30px;
            white-space: nowrap;
        }

        .phase-header .phase-count .done {
            color: var(--success);
        }

        /* ============================================
           GRID DE CARDS (TÓPICOS)
           ============================================ */
        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .topic-card {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 14px;
            padding: 16px 8px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-height: 100px;
            position: relative;
        }

        .topic-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.08);
            background: #ffffff;
        }

        .topic-card .material-symbols-outlined {
            font-size: 28px;
            color: var(--gray-500);
            transition: color 0.15s;
        }

        .topic-card .topic-title {
            font-size: 12.5px;
            font-weight: 600;
            line-height: 1.2;
            color: var(--gray-800);
        }

        .topic-card .topic-badge {
            font-size: 10px;
            font-weight: 600;
            background: var(--gray-200);
            padding: 1px 10px;
            border-radius: 30px;
            color: var(--gray-600);
            letter-spacing: 0.3px;
        }

        .topic-card .check-mark {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 16px;
            color: var(--success);
            opacity: 0;
            transition: opacity 0.15s;
        }

        /* Estado CONCLUÍDO */
        .topic-card.done {
            background: var(--success-light);
            border-color: #bbf7d0;
        }

        .topic-card.done .material-symbols-outlined {
            color: var(--success);
        }

        .topic-card.done .topic-badge {
            background: #bbf7d0;
            color: #166534;
        }

        .topic-card.done .check-mark {
            opacity: 1;
        }

        .topic-card.done:hover {
            border-color: var(--success);
        }

        /* ============================================
           LINK PARA DETALHES (ícone no canto inferior)
           ============================================ */
        .topic-card .detail-link {
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 14px;
            color: var(--gray-400);
            opacity: 0;
            transition: opacity 0.15s;
            text-decoration: none;
        }

        .topic-card:hover .detail-link {
            opacity: 1;
        }

        .topic-card .detail-link:hover {
            color: var(--primary);
        }

        /* ============================================
           RODAPÉ
           ============================================ */
        .app-footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--gray-200);
            font-size: 13px;
            color: var(--gray-500);
        }

        .app-footer .material-symbols-outlined {
            font-size: 16px;
            vertical-align: middle;
            color: var(--primary);
        }

        /* ============================================
           RESPONSIVIDADE
           ============================================ */
        @media (max-width: 768px) {
            body {
                padding: 16px 10px;
            }

            .top-bar {
                padding: 16px 18px;
                flex-direction: column;
                align-items: stretch;
            }

            .top-bar .brand h1 {
                font-size: 20px;
            }

            .top-bar .stats {
                justify-content: space-between;
            }

            .top-bar .stats .progress-wrap {
                min-width: 120px;
                flex: 1;
            }

            .phase-card {
                padding: 16px 14px 18px;
            }

            .phase-header {
                flex-wrap: wrap;
            }

            .phase-header .phase-desc {
                width: 100%;
                margin-left: 0;
                font-size: 12px;
            }

            .phase-header .phase-count {
                margin-left: 0;
                font-size: 12px;
            }

            .topic-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 8px;
            }

            .topic-card {
                min-height: 85px;
                padding: 12px 4px 10px;
            }

            .topic-card .topic-title {
                font-size: 11px;
            }

            .topic-card .material-symbols-outlined {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .topic-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }

            .topic-card {
                min-height: 75px;
                padding: 10px 2px 8px;
            }

            .topic-card .topic-title {
                font-size: 10px;
            }

            .topic-card .material-symbols-outlined {
                font-size: 18px;
            }

            .topic-card .topic-badge {
                font-size: 8px;
                padding: 0 8px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ============================================ -->
        <!-- TOP BAR                                      -->
        <!-- ============================================ -->
        <div class="top-bar">
            <div class="brand">
                <h1>
                    <span class="material-symbols-outlined" style="font-size:28px; vertical-align:middle; color:var(--primary);">psychology</span>
                    Plano de <span>Estudos</span>
                </h1>
                <div class="subtitle">Matemática para Machine Learning · 100 conceitos essenciais</div>
            </div>
            <div class="stats">
                <div class="progress-wrap">
                    <div class="progress-label">
                        <span>Progresso</span>
                        <span id="progressText">0 / 100</span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" id="progressFill" style="width:0%;"></div>
                    </div>
                </div>
                <button class="btn-reset" id="resetBtn">
                    <span class="material-symbols-outlined">refresh</span>
                    Redefinir
                </button>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- FASES (injetadas via JS)                     -->
        <!-- ============================================ -->
        <div id="phasesContainer"></div>

        <!-- ============================================ -->
        <!-- RODAPÉ                                       -->
        <!-- ============================================ -->
        <div class="app-footer">
            <span class="material-symbols-outlined">lightbulb</span>
            Clique em cada card para marcar como concluído.
            <span style="color:var(--gray-300); margin:0 8px;">·</span>
            1h/dia · consistência é a chave.
            <br class="d-sm-none" />
            <span style="color:var(--gray-400); font-size:12px; margin-top:4px; display:inline-block;">
                <span class="material-symbols-outlined" style="font-size:14px;">open_in_new</span>
                Clique no ícone <span class="material-symbols-outlined" style="font-size:14px;">chevron_right</span> para ver os detalhes de cada tópico.
            </span>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- BOOTSTRAP JS (opcional, para toggles etc)   -->
    <!-- ============================================ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
        // ----------------------------------------------------------------
        // 1. DADOS: 100 conceitos distribuídos em 7 fases
        // ----------------------------------------------------------------
        const phases = [{
            id: 'phase1',
            icon: 'view_module',
            label: 'Álgebra Linear I',
            description: 'Vetores, matrizes, operações e produto escalar',
            concepts: [
                'Vetores e escalares', 'Soma de vetores', 'Multiplicação por escalar',
                'Combinação linear', 'Dependência linear', 'Bases e dimensão',
                'Matriz: definição', 'Soma de matrizes', 'Multiplicação matriz-vetor',
                'Multiplicação matriz-matriz', 'Transposição', 'Matriz identidade',
                'Matriz inversa', 'Sistemas lineares', 'Método de Gauss',
                'Posto (rank)', 'Traço', 'Determinante (intuição)',
                'Produto escalar (dot)', 'Norma L2 (Euclidiana)',
                'Norma L1 (Manhattan)', 'Distância entre vetores',
                'Projeção ortogonal', 'Espaço linha e coluna'
            ]
        }, {
            id: 'phase2',
            icon: 'calculate',
            label: 'Cálculo Diferencial',
            description: 'Derivadas, gradientes e regra da cadeia',
            concepts: [
                'Limite (intuição)', 'Derivada de polinômios', 'Derivada de exponencial',
                'Derivada de log', 'Regra do produto', 'Regra do quociente',
                'Regra da cadeia', 'Derivadas parciais', 'Gradiente: definição',
                'Gradiente: interpretação', 'Derivada direcional', 'Hessiana (introdução)',
                'Máximos e mínimos', 'Ponto de sela', 'Função convexa vs não-convexa',
                'Série de Taylor (básico)', 'Otimização contínua', 'Descida do gradiente',
                'Taxa de aprendizado', 'Momentum (intuição)', 'Adam (intuição)',
                'Backpropagation: visão geral', 'Regra da cadeia em redes', 'Derivada de softmax'
            ]
        }, {
            id: 'phase3',
            icon: 'bar_chart',
            label: 'Estatística & Probabilidade I',
            description: 'Distribuições, Bayes e MLE',
            concepts: [
                'Média aritmética', 'Mediana e moda', 'Variância e desvio',
                'Covariância', 'Correlação de Pearson', 'Probabilidade condicional',
                'Teorema de Bayes', 'Distribuição Normal', 'Distribuição Bernoulli',
                'Distribuição Binomial', 'Distribuição Poisson', 'Uniforme',
                'Valor esperado', 'Lei dos grandes números', 'Teorema Central do Limite',
                'Função de verossimilhança', 'Máxima Verossimilhança (MLE)',
                'Log-verossimilhança', 'Estimador de Bayes (MAP)', 'Prior e posteriori',
                'Entropia (Shannon)', 'Entropia cruzada (classificação)',
                'Divergência de KL', 'Viés e variância (trade-off)'
            ]
        }, {
            id: 'phase4',
            icon: 'linear_scale',
            label: 'Álgebra Linear II',
            description: 'Autovalores, SVD e decomposições',
            concepts: [
                'Autovalor e autovetor', 'Polinômio característico',
                'Diagonalização de matrizes', 'Decomposição LU', 'Decomposição QR',
                'Decomposição de Cholesky', 'Decomposição em Valores Singulares (SVD)',
                'SVD: intuição geométrica', 'SVD: aplicações (PCA)', 'Posto aproximado',
                'Matriz de covariância', 'PCA (Análise de Componentes)',
                'PCA: autovetores e autovalores', 'Redução de dimensionalidade',
                'Projeção em subespaço', 'Mínimos quadrados (normal equation)',
                'Regressão linear via álgebra', 'Ridge regression (L2)',
                'Lasso (L1) e esparsidade', 'Elastic Net', 'Matrizes definidas positivas',
                'Cálculo matricial (Jacobiana)', 'Produto de Kronecker (básico)',
                'Tensor: introdução'
            ]
        }, {
            id: 'phase5',
            icon: 'show_chart',
            label: 'Otimização Avançada',
            description: 'Métodos de gradiente e convergência',
            concepts: [
                'Gradiente descendente batch', 'SGD (estocástico)',
                'Mini-batch', 'Momentum (Nesterov)', 'RMSprop', 'Adam',
                'AdamW', 'Taxa de aprendizado adaptativa', 'Learning rate decay',
                'Gradiente clipping', 'Otimização de segunda ordem',
                'Método de Newton', 'Quasi-Newton (BFGS)', 'Condições de Karush-Kuhn-Tucker',
                'Otimização convexa', 'Otimização não-convexa', 'Pontos críticos',
                'Superfícies de perda', 'Paisagem de erro em redes',
                'Inicialização de pesos', 'Batch normalization', 'Regularização L1/L2',
                'Dropout (interpretação)', 'Early stopping', 'Transfer learning (otimização)'
            ]
        }, {
            id: 'phase6',
            icon: 'psychology',
            label: 'Probabilidade & Inferência II',
            description: 'Processos estocásticos e modelos generativos',
            concepts: [
                'Cadeias de Markov', 'Matriz de transição', 'Distribuição estacionária',
                'Processos estocásticos', 'Passeio aleatório', 'Modelos ocultos de Markov',
                'Filtro de Kalman (básico)', 'Inferência bayesiana',
                'Monte Carlo (amostragem)', 'MCMC (Markov Chain Monte Carlo)',
                'Gibbs sampling', 'Variância e covariância em amostras',
                'Intervalo de confiança', 'Teste de hipóteses (p-valor)',
                'Teste A/B', 'Distribuição t-Student', 'Qui-quadrado',
                'Regressão logística (probabilística)', 'Softmax como probabilidade',
                'Distribuição categórica', 'Processos Gaussianos (introdução)',
                'GMM (Gaussian Mixture Models)', 'EM (Expectation-Maximização)',
                'VAE: intuição probabilística'
            ]
        }, {
            id: 'phase7',
            icon: 'rocket_launch',
            label: 'Aplicações & Integração',
            description: 'Conectando matemática ao ML prático',
            concepts: [
                'Regressão linear: solução fechada', 'Regressão linear: SGD',
                'Regressão logística: MLE', 'SVM: margem e dualidade',
                'SVM: kernel (mapeamento)', 'Kernel trick', 'Árvores de decisão (entropia)',
                'Floresta aleatória (bagging)', 'Gradient Boosting (intuição)',
                'Redes neurais: função de ativação', 'ReLU e derivadas',
                'Tanh e Sigmoid', 'Funções de perda: MSE', 'Entropia cruzada binária',
                'Entropia cruzada categórica', 'Regularização em redes',
                'Convolução: matemática', 'Pooling e downsampling',
                'RNN: retropropagação temporal', 'LSTM: equações de portas',
                'Attention: produto escalar', 'Transformer: QKV',
                'Campos aleatórios condicionais (CRF)', 'Avaliação: métricas (precisão, recall)'
            ]
        }];

        // ----------------------------------------------------------------
        // 2. ESTADO
        // ----------------------------------------------------------------
        const allConcepts = phases.flatMap(p => p.concepts);
        const TOTAL = allConcepts.length;
        let completed = new Array(TOTAL).fill(false);

        function loadProgress() {
            const saved = localStorage.getItem('mathML_progress_v2');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length === TOTAL) {
                        completed = parsed;
                    }
                } catch (e) { console.warn(e); }
            }
        }

        function saveProgress() {
            localStorage.setItem('mathML_progress_v2', JSON.stringify(completed));
        }

        // ----------------------------------------------------------------
        // 3. RENDERIZAÇÃO
        // ----------------------------------------------------------------
        function render() {
            const container = document.getElementById('phasesContainer');
            container.innerHTML = '';

            let globalIndex = 0;

            for (const phase of phases) {
                const phaseConcepts = phase.concepts;
                const phaseStart = globalIndex;
                const doneInPhase = phaseConcepts.filter((_, i) => completed[phaseStart + i]).length;

                // Cria o card da fase
                const phaseDiv = document.createElement('div');
                phaseDiv.className = 'phase-card';

                // Header da fase
                const header = document.createElement('div');
                header.className = 'phase-header';
                header.innerHTML = `
                    <div class="icon-wrap">
                        <span class="material-symbols-outlined">${phase.icon}</span>
                    </div>
                    <div>
                        <div class="phase-title">${phase.label}</div>
                        <div class="phase-desc">${phase.description}</div>
                    </div>
                    <div class="phase-count">
                        <span class="done">${doneInPhase}</span> / ${phaseConcepts.length}
                    </div>
                `;
                phaseDiv.appendChild(header);

                // Grid de tópicos
                const grid = document.createElement('div');
                grid.className = 'topic-grid';

                for (let i = 0; i < phaseConcepts.length; i++) {
                    const idx = globalIndex + i;
                    const title = phaseConcepts[i];
                    const isDone = completed[idx];

                    const card = document.createElement('div');
                    card.className = `topic-card ${isDone ? 'done' : ''}`;
                    card.setAttribute('data-idx', idx);

                    // Ícone dinâmico
                    const iconName = isDone ? 'check_circle' :
                        (idx % 5 === 0 ? 'functions' :
                            idx % 4 === 0 ? 'calculate' :
                            idx % 3 === 0 ? 'data_array' : 'widgets');

                    card.innerHTML = `
                        <span class="material-symbols-outlined">${iconName}</span>
                        <div class="topic-title">${title}</div>
                        <span class="topic-badge">#${idx+1}</span>
                        <span class="check-mark material-symbols-outlined">check_circle</span>
                        <a href="#" class="detail-link" title="Ver detalhes do tópico" onclick="event.stopPropagation();">
                            <span class="material-symbols-outlined" style="font-size:16px;">chevron_right</span>
                        </a>
                    `;

                    // Clique para marcar/desmarcar
                    card.addEventListener('click', (e) => {
                        // Se clicou no link de detalhes, não toggle
                        if (e.target.closest('.detail-link')) return;
                        completed[idx] = !completed[idx];
                        saveProgress();
                        render();
                    });

                    grid.appendChild(card);
                }

                phaseDiv.appendChild(grid);
                container.appendChild(phaseDiv);

                globalIndex += phaseConcepts.length;
            }

            // Atualiza barra de progresso
            const totalDone = completed.filter(Boolean).length;
            document.getElementById('progressText').textContent = `${totalDone} / ${TOTAL}`;
            document.getElementById('progressFill').style.width = `${(totalDone / TOTAL) * 100}%`;
        }

        // ----------------------------------------------------------------
        // 4. RESET
        // ----------------------------------------------------------------
        function resetProgress() {
            if (confirm('Limpar todo o progresso?')) {
                completed.fill(false);
                saveProgress();
                render();
            }
        }

        // ----------------------------------------------------------------
        // 5. INIT
        // ----------------------------------------------------------------
        loadProgress();
        render();

        document.getElementById('resetBtn').addEventListener('click', resetProgress);

        // Atalho: Ctrl+R para reset
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' && e.ctrlKey) {
                e.preventDefault();
                resetProgress();
            }
        });

        // Log para debug (pode remover depois)
        console.log(`📚 Plano de Estudos carregado: ${TOTAL} tópicos em ${phases.length} fases.`);
    </script>

</body>
</html>
